[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ossguard"
version = "0.1.0"
description = "A stochastic game and PSRO framework for OSS trust and security research"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["open-source security", "game theory", "reinforcement learning", "PSRO", "software supply chain"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24", "torch>=2.1", "nashpy>=0.0.41"]

[project.optional-dependencies]
dev = ["ruff>=0.5"]

[project.scripts]
ossguard = "ossguard.cli:main"

[tool.setuptools.packages.find]
include = ["ossguard*"]

[tool.ruff]
line-length = 100
target-version = "py310"
